[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "circuit-spec"
version = "0.1.0"
description = "Typed, YAML-based electronic circuit specifications"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0.2"]

[project.optional-dependencies]
docs = [
    "graphviz>=0.20.3,<1",
    "matplotlib>=3.11.2,<4",
    "Sphinx>=9.1.1,<10",
    "sphinx-book-theme>=1.4.0,<2",
    "sphinx-gallery>=0.22.1,<1",
]

[project.scripts]
circuitspec = "circuitspec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
