[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "circuit-spec"
version = "0.1.0"
description = "Typed, YAML-based electronic circuit specifications"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0.2"]

[project.scripts]
circuitspec = "circuitspec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
